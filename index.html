<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano Progress Tracker</title>
  <!-- Tailwind via CDN -->
  <!-- Tailwind via Local Build -->

  <style>
    body {
      background-color: #f3f4f6;
      /* gray-100 */
    }

    /* Custom scrollbar for nicer feel */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
  </style>

</head>

  <!-- CRITICAL: Entry point for Vite build system -->
